<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1378" font-family="Arial,sans-serif"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#222"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect x="190" y="10" width="330" height="26" rx="6" fill="#dae8fc" stroke="#666"/><text x="355.0" y="28" font-size="11" font-weight="bold" text-anchor="middle">PRESENTATION TIER</text><rect x="540" y="10" width="140" height="26" rx="6" fill="#fff2cc" stroke="#666"/><text x="610.0" y="28" font-size="11" font-weight="bold" text-anchor="middle">BUSINESS LOGIC TIER</text><rect x="700" y="10" width="340" height="26" rx="6" fill="#d5e8d4" stroke="#666"/><text x="870.0" y="28" font-size="11" font-weight="bold" text-anchor="middle">DATA TIER</text><line x1="100" y1="90" x2="100" y2="1348" stroke="#888" stroke-dasharray="5,4"/><rect x="30" y="46" width="140" height="44" rx="6" fill="#f5f5f5" stroke="#333"/><text x="100" y="66" font-size="11" font-weight="bold" text-anchor="middle">Shipper</text><text x="100" y="81" font-size="10" text-anchor="middle">«Actor»</text><line x1="270" y1="90" x2="270" y2="1348" stroke="#888" stroke-dasharray="5,4"/><rect x="200" y="46" width="140" height="44" rx="6" fill="#dae8fc" stroke="#333"/><text x="270" y="66" font-size="11" font-weight="bold" text-anchor="middle">ShipperApp</text><text x="270" y="81" font-size="10" text-anchor="middle">Presentation Tier</text><line x1="440" y1="90" x2="440" y2="1348" stroke="#888" stroke-dasharray="5,4"/><rect x="370" y="46" width="140" height="44" rx="6" fill="#dae8fc" stroke="#333"/><text x="440" y="66" font-size="11" font-weight="bold" text-anchor="middle">DeliveryController</text><text x="440" y="81" font-size="10" text-anchor="middle">Presentation/API</text><line x1="610" y1="90" x2="610" y2="1348" stroke="#888" stroke-dasharray="5,4"/><rect x="540" y="46" width="140" height="44" rx="6" fill="#fff2cc" stroke="#333"/><text x="610" y="66" font-size="11" font-weight="bold" text-anchor="middle">DeliveryService</text><text x="610" y="81" font-size="10" text-anchor="middle">Business Logic Tier</text><line x1="780" y1="90" x2="780" y2="1348" stroke="#888" stroke-dasharray="5,4"/><rect x="710" y="46" width="140" height="44" rx="6" fill="#d5e8d4" stroke="#333"/><text x="780" y="66" font-size="11" font-weight="bold" text-anchor="middle">PackageRepository</text><text x="780" y="81" font-size="10" text-anchor="middle">Data Access</text><line x1="950" y1="90" x2="950" y2="1348" stroke="#888" stroke-dasharray="5,4"/><rect x="880" y="46" width="140" height="44" rx="6" fill="#d5e8d4" stroke="#333"/><text x="950" y="66" font-size="11" font-weight="bold" text-anchor="middle">Database</text><text x="950" y="81" font-size="10" text-anchor="middle">Data Tier</text><rect x="30" y="496" width="1010" height="840" fill="none" stroke="#333"/><rect x="30" y="496" width="50" height="22" fill="#eee" stroke="#333"/><text x="55" y="512" font-size="11" font-weight="bold" text-anchor="middle">alt</text><text x="90" y="512" font-size="11" font-weight="bold">[Khách nhận hàng thành công]</text><line x1="30" y1="816" x2="1040" y2="816" stroke="#333" stroke-dasharray="6,4"/><text x="90" y="834" font-size="11" font-weight="bold" fill="#b85450">[Alternative Flow: khách vắng nhà / từ chối nhận]</text><line x1="100" y1="150" x2="270" y2="150" stroke="#222"  marker-end="url(#a)"/><text x="185.0" y="145" font-size="10" text-anchor="middle">1. Chọn đơn #RK-8899, nhấn &#x27;Xác nhận&#x27;</text><line x1="270" y1="192" x2="440" y2="192" stroke="#222"  marker-end="url(#a)"/><text x="355.0" y="187" font-size="10" text-anchor="middle">2. POST /deliveries/RK-8899/confirm (DTO: GPS, codAmount, photo)</text><line x1="440" y1="234" x2="610" y2="234" stroke="#222"  marker-end="url(#a)"/><text x="525.0" y="229" font-size="10" text-anchor="middle">3. confirmDelivery(dto)</text><line x1="610" y1="276" x2="780" y2="276" stroke="#222"  marker-end="url(#a)"/><text x="695.0" y="271" font-size="10" text-anchor="middle">4. findById(&#x27;RK-8899&#x27;)</text><line x1="780" y1="318" x2="950" y2="318" stroke="#222"  marker-end="url(#a)"/><text x="865.0" y="313" font-size="10" text-anchor="middle">5. SELECT ... WHERE id=? (tham số hóa)</text><line x1="950" y1="360" x2="780" y2="360" stroke="#222" stroke-dasharray="5,3" marker-end="url(#a)"/><text x="865.0" y="355" font-size="10" text-anchor="middle">Package</text><line x1="780" y1="402" x2="610" y2="402" stroke="#222" stroke-dasharray="5,3" marker-end="url(#a)"/><text x="695.0" y="397" font-size="10" text-anchor="middle">Package</text><rect x="485" y="430" width="250" height="30" rx="6" fill="#fff2cc" stroke="#d6b656"/><text x="610" y="449" font-size="10" text-anchor="middle">6. Kiểm tra GPS ≤ 100 m; codAmount = COD; có ảnh</text><line x1="610" y1="522" x2="780" y2="522" stroke="#222"  marker-end="url(#a)"/><text x="695.0" y="517" font-size="10" text-anchor="middle">7a. updateStatus(id, DELIVERED)</text><line x1="780" y1="564" x2="950" y2="564" stroke="#222"  marker-end="url(#a)"/><text x="865.0" y="559" font-size="10" text-anchor="middle">8a. UPDATE Package SET Status=?</text><line x1="950" y1="606" x2="780" y2="606" stroke="#222" stroke-dasharray="5,3" marker-end="url(#a)"/><text x="865.0" y="601" font-size="10" text-anchor="middle">OK</text><line x1="780" y1="648" x2="610" y2="648" stroke="#222" stroke-dasharray="5,3" marker-end="url(#a)"/><text x="695.0" y="643" font-size="10" text-anchor="middle">OK</text><line x1="610" y1="690" x2="440" y2="690" stroke="#222" stroke-dasharray="5,3" marker-end="url(#a)"/><text x="525.0" y="685" font-size="10" text-anchor="middle">9a. DeliveryResult(SUCCESS)</text><line x1="440" y1="732" x2="270" y2="732" stroke="#222" stroke-dasharray="5,3" marker-end="url(#a)"/><text x="355.0" y="727" font-size="10" text-anchor="middle">10a. HTTP 200</text><line x1="270" y1="774" x2="100" y2="774" stroke="#222" stroke-dasharray="5,3" marker-end="url(#a)"/><text x="185.0" y="769" font-size="10" text-anchor="middle">11a. Hiển thị &#x27;Giao hàng thành công&#x27;</text><line x1="100" y1="864" x2="270" y2="864" stroke="#222"  marker-end="url(#a)"/><text x="185.0" y="859" font-size="10" text-anchor="middle">7b. Chọn &#x27;Giao thất bại&#x27; + lý do</text><line x1="270" y1="906" x2="440" y2="906" stroke="#222"  marker-end="url(#a)"/><text x="355.0" y="901" font-size="10" text-anchor="middle">8b. POST /deliveries/RK-8899/fail (reason, GPS)</text><line x1="440" y1="948" x2="610" y2="948" stroke="#222"  marker-end="url(#a)"/><text x="525.0" y="943" font-size="10" text-anchor="middle">9b. failDelivery(dto)</text><rect x="450" y="976" width="320" height="30" rx="6" fill="#fff2cc" stroke="#d6b656"/><text x="610" y="995" font-size="10" text-anchor="middle">10b. Ghi lý do; Status=FAILED_ATTEMPT_1; lập lịch giao lại lần 2</text><line x1="610" y1="1038" x2="780" y2="1038" stroke="#222"  marker-end="url(#a)"/><text x="695.0" y="1033" font-size="10" text-anchor="middle">11b. saveAttempt(reason) + scheduleRetry(attempt=2)</text><line x1="780" y1="1080" x2="950" y2="1080" stroke="#222"  marker-end="url(#a)"/><text x="865.0" y="1075" font-size="10" text-anchor="middle">12b. INSERT Attempt / UPDATE Package (transaction)</text><line x1="950" y1="1122" x2="780" y2="1122" stroke="#222" stroke-dasharray="5,3" marker-end="url(#a)"/><text x="865.0" y="1117" font-size="10" text-anchor="middle">OK</text><line x1="780" y1="1164" x2="610" y2="1164" stroke="#222" stroke-dasharray="5,3" marker-end="url(#a)"/><text x="695.0" y="1159" font-size="10" text-anchor="middle">OK</text><line x1="610" y1="1206" x2="440" y2="1206" stroke="#222" stroke-dasharray="5,3" marker-end="url(#a)"/><text x="525.0" y="1201" font-size="10" text-anchor="middle">13b. DeliveryResult(FAILED_1, retryDate)</text><line x1="440" y1="1248" x2="270" y2="1248" stroke="#222" stroke-dasharray="5,3" marker-end="url(#a)"/><text x="355.0" y="1243" font-size="10" text-anchor="middle">14b. HTTP 200 + retryDate</text><line x1="270" y1="1290" x2="100" y2="1290" stroke="#222" stroke-dasharray="5,3" marker-end="url(#a)"/><text x="185.0" y="1285" font-size="10" text-anchor="middle">15b. Hiển thị lịch giao lại lần 2</text></svg>